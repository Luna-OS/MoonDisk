name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. v0.1.0). Must match src-tauri/tauri.conf.json's version."
        required: true
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci
      - run: npx tauri build --bundles deb,rpm,appimage
        env:
          # Signs the AppImage's updater artifact (createUpdaterArtifacts in
          # tauri.conf.json) so tauri-plugin-updater can verify it before
          # installing. Must be set as repo secrets — see
          # docs comment in tauri.conf.json's `plugins.updater` for the
          # matching public key. deb/rpm are unaffected: apt/dnf handle
          # their own updates, MoonDisk's updater never touches them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Checksums
        working-directory: src-tauri/target/release/bundle
        run: |
          find . -maxdepth 2 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec sha256sum {} \; > ../../../../checksums-linux.txt

      - uses: actions/upload-artifact@v4
        with:
          name: moondisk-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            checksums-linux.txt

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npx tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Checksums
        shell: bash
        working-directory: src-tauri/target/release/bundle/nsis
        run: sha256sum *.exe > ../../../../../checksums-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: moondisk-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            checksums-windows.txt

  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v5
        with:
          name: moondisk-linux
          path: dist/linux
      - uses: actions/download-artifact@v5
        with:
          name: moondisk-windows
          path: dist/windows

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate latest.json (auto-update manifest)
        run: |
          node scripts/generate-latest-json.mjs \
            "${{ steps.version.outputs.tag }}" \
            "${{ github.repository }}" \
            dist/linux \
            dist/windows \
            dist/latest.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "MoonDisk ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: |
            dist/linux/**/*.deb
            dist/linux/**/*.rpm
            dist/linux/**/*.AppImage
            dist/linux/**/*.AppImage.sig
            dist/linux/checksums-linux.txt
            dist/windows/**/*.exe
            dist/windows/**/*.exe.sig
            dist/windows/checksums-windows.txt
            dist/latest.json
