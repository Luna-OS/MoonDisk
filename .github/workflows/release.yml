name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. v0.1.0). Must match src-tauri/tauri.conf.json's version."
        required: true
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci
      - run: npx tauri build --bundles deb,rpm

      - name: Checksums
        working-directory: src-tauri/target/release/bundle
        run: |
          find . -maxdepth 2 -type f \( -name '*.deb' -o -name '*.rpm' \) -exec sha256sum {} \; > ../../../../checksums-linux.txt

      - uses: actions/upload-artifact@v4
        with:
          name: moondisk-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            checksums-linux.txt

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npx tauri build --bundles nsis

      - name: Checksums
        shell: bash
        working-directory: src-tauri/target/release/bundle/nsis
        run: sha256sum *.exe > ../../../../../checksums-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: moondisk-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            checksums-windows.txt

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The native SwiftUI app plus its Rust helper, as one DMG that runs on
      # both Apple Silicon and Intel Macs.
      - run: macos/build-app.sh

      - name: Checksums
        working-directory: macos/build
        run: shasum -a 256 *.dmg > ../../checksums-macos.txt

      - uses: actions/upload-artifact@v4
        with:
          name: moondisk-macos
          path: |
            macos/build/*.dmg
            checksums-macos.txt

  publish:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: moondisk-linux
          path: dist/linux
      - uses: actions/download-artifact@v5
        with:
          name: moondisk-windows
          path: dist/windows
      - uses: actions/download-artifact@v5
        with:
          name: moondisk-macos
          path: dist/macos

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "MoonDisk ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: |
            dist/linux/**/*.deb
            dist/linux/**/*.rpm
            dist/linux/checksums-linux.txt
            dist/windows/**/*.exe
            dist/windows/checksums-windows.txt
            dist/macos/**/*.dmg
            dist/macos/checksums-macos.txt
